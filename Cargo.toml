[package]
name = "popbio-studio"
version = "1.2.0"
edition = "2021"
authors = ["Bryan P. White <CRV Science>"]
description = "Native Rust GUI educational population biology, Sewall Wright 3D adaptive landscapes, Leslie/Lefkovitch matrices, Bayesian Skyline, and haplotype network simulator"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["wgpu"] }
egui = "0.31"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
